<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>Save, then send</title><style>
.iso{
  --anatomy-page:#0b0b0b;--anatomy-card:#131313;--anatomy-text:#a3a3a3;--anatomy-strong:#e6e6e6;--anatomy-muted:#6e6e6e;
  --anatomy-paper:#131313;--anatomy-face:#1b1b1b;--anatomy-top:#1c1c1c;
  --anatomy-shade-0:#0f0f0f;--anatomy-shade-1:#121212;--anatomy-shade-2:#151515;--anatomy-shade-3:#181818;
  --anatomy-lit-top:#262626;--anatomy-lit-shade:#1d1d1d;
  --anatomy-hi:#d4d4d4;--anatomy-mid:#6a6a6a;--anatomy-lo:#3e3e3e;--anatomy-faint:#2a2a2a;--anatomy-lit:#ffffff;
  --anatomy-halo:#050505;--anatomy-halo-opacity:.9;--anatomy-dot:#e6e6e6;
  --anatomy-red:#ff6b6b;--anatomy-green:#6be0a0;--anatomy-blue:#6b9bff;
  --anatomy-weight:.6px;--anatomy-ease:cubic-bezier(.32,.72,0,1);
  --anatomy-mono:ui-monospace,"SF Mono",Menlo,Consolas,monospace;
  --anatomy-lift:inset 0 1px 0 0 #ffffff0a,inset 0 0 0 1px #ffffff06,0 0 0 1px #00000026,0 1px 1px -.5px #00000014,0 3px 3px -1.5px #00000014,0 6px 6px -3px #00000014,0 12px 12px -6px #00000014;
}
.iso[data-theme="light"]{
  --anatomy-page:#f2f2ef;--anatomy-card:#fbfbfa;--anatomy-text:#57575a;--anatomy-strong:#18181a;--anatomy-muted:#8c8c90;
  --anatomy-paper:#fbfbfa;--anatomy-face:#ffffff;--anatomy-top:#ffffff;
  --anatomy-shade-0:#dcdcd9;--anatomy-shade-1:#e5e5e2;--anatomy-shade-2:#ededea;--anatomy-shade-3:#f4f4f1;
  --anatomy-lit-top:#ffffff;--anatomy-lit-shade:#eeeeeb;
  --anatomy-hi:#26262a;--anatomy-mid:#8a8a8f;--anatomy-lo:#b4b4b8;--anatomy-faint:#d4d4d6;--anatomy-lit:#000000;
  --anatomy-halo:#8a8a80;--anatomy-halo-opacity:.32;--anatomy-dot:#3a3a3e;
  --anatomy-red:#e5484d;--anatomy-green:#30a46c;--anatomy-blue:#3e63dd;
  --anatomy-lift:inset 0 1px 0 0 #ffffff,0 0 0 1px #0000000f,0 1px 1px -.5px #0000000a,0 3px 3px -1.5px #0000000a,0 6px 6px -3px #0000000a,0 12px 12px -6px #0000000a;
}
.iso-svg{display:block;width:100%;height:auto;overflow:visible}
.iso-svg path,.iso-svg circle{vector-effect:non-scaling-stroke}
.iso-fill{fill:var(--anatomy-paper);stroke:none}
.iso-solid[data-lit]>.iso-fill{fill:var(--anatomy-face)}
.iso-shade,.iso-top{stroke:none}
.iso-shade[data-shade="0"]{fill:var(--anatomy-shade-0)}
.iso-shade[data-shade="1"]{fill:var(--anatomy-shade-1)}
.iso-shade[data-shade="2"]{fill:var(--anatomy-shade-2)}
.iso-shade[data-shade="3"]{fill:var(--anatomy-shade-3)}
.iso-top{fill:var(--anatomy-top)}
.iso-solid[data-lit]>.iso-top{fill:var(--anatomy-lit-top)}
.iso-solid[data-lit]>.iso-shade{fill:var(--anatomy-lit-shade)}
.iso-solid[data-seamless]>.iso-shade,.iso-solid[data-seamless]>.iso-top{stroke-width:.4;stroke-linejoin:round}
.iso-solid[data-seamless]>.iso-shade[data-shade="0"]{stroke:var(--anatomy-shade-0)}
.iso-solid[data-seamless]>.iso-shade[data-shade="1"]{stroke:var(--anatomy-shade-1)}
.iso-solid[data-seamless]>.iso-shade[data-shade="2"]{stroke:var(--anatomy-shade-2)}
.iso-solid[data-seamless]>.iso-shade[data-shade="3"]{stroke:var(--anatomy-shade-3)}
.iso-solid[data-seamless]>.iso-top{stroke:var(--anatomy-top)}
.iso-solid[data-seamless][data-lit]>.iso-top{stroke:var(--anatomy-lit-top)}
.iso-solid[data-seamless][data-lit]>.iso-shade{stroke:var(--anatomy-lit-shade)}
.iso-solid[data-lit]>.iso-edge{stroke:var(--anatomy-lit)}
.iso-halo{fill:var(--anatomy-halo);stroke:none;filter:blur(9px);opacity:var(--anatomy-halo-opacity);transform:translateY(3px)}
.iso-line{fill:none;stroke:var(--anatomy-lo);stroke-width:var(--anatomy-weight);stroke-linecap:round;stroke-linejoin:round}
.iso-line[data-tone="hi"]{stroke:var(--anatomy-hi)}
.iso-line[data-tone="mid"]{stroke:var(--anatomy-mid)}
.iso-line[data-tone="lo"]{stroke:var(--anatomy-lo)}
.iso-line[data-tone="faint"]{stroke:var(--anatomy-faint)}
.iso-line[data-tone="lit"]{stroke:var(--anatomy-lit)}
.iso-line[data-tone="red"]{stroke:var(--anatomy-red)}
.iso-line[data-tone="green"]{stroke:var(--anatomy-green)}
.iso-line[data-tone="blue"]{stroke:var(--anatomy-blue)}
.iso-line[data-dotted]{stroke-dasharray:.01 3.5;stroke-width:1}
.iso-line[data-dashed]{stroke-dasharray:3 3}
.iso-line[data-flow]{stroke-dasharray:2 6}
.iso-wire-end{fill:var(--anatomy-paper);stroke:var(--anatomy-lo);stroke-width:var(--anatomy-weight)}
.iso-wire[data-tone="hi"] .iso-wire-end{stroke:var(--anatomy-hi)}
.iso-wire[data-tone="mid"] .iso-wire-end{stroke:var(--anatomy-mid)}
.iso-wire[data-tone="faint"] .iso-wire-end{stroke:var(--anatomy-faint)}
.iso-wire[data-tone="lit"] .iso-wire-end{stroke:var(--anatomy-lit)}
.iso-dots circle{fill:var(--anatomy-dot);stroke:none;opacity:.32}
.iso-dots[data-tone="hi"] circle{opacity:.85}
.iso-dots[data-tone="mid"] circle{opacity:.45}
.iso-dots[data-tone="lo"] circle{opacity:.22}
.iso-dots[data-tone="faint"] circle{opacity:.12}
.iso-face-text{fill:var(--anatomy-mid);font-family:var(--anatomy-mono);letter-spacing:.04em}
.iso-face-text[data-tone="hi"]{fill:var(--anatomy-hi)}
.iso-face-text[data-tone="lo"]{fill:var(--anatomy-lo)}
.iso-face-text[data-tone="faint"]{fill:var(--anatomy-faint)}
.tb-body{fill:var(--anatomy-shade-2);stroke:none}
.tb-shine{fill:var(--anatomy-top);stroke:none}
.tb-shade{fill:var(--anatomy-shade-0);stroke:none}
.tb-ring{fill:none;stroke:var(--anatomy-lo);stroke-width:.45;stroke-linecap:butt;stroke-linejoin:round}
.tb-ring[data-tone="mid"]{stroke:var(--anatomy-mid)}
.tb-ring[data-tone="faint"]{stroke:var(--anatomy-faint)}
.tb-ring[data-tone="hi"]{stroke:var(--anatomy-hi)}
@keyframes iso-flow{to{stroke-dashoffset:-32}}
@keyframes iso-pulse{0%,100%{opacity:.18}12%{opacity:1}40%{opacity:.18}}
.iso-line[data-flow]{animation:iso-flow 1600ms linear infinite}
.iso-dots circle[data-pulse]{animation:iso-pulse 1600ms steps(1,end) infinite;animation-delay:var(--pulse-at,0ms)}
.iso-figure{margin:32px 0 36px}
.iso-plate{position:relative;padding:52px 24px;border-radius:0;background:var(--anatomy-card);box-shadow:0 0 0 1px var(--anatomy-mid);--anatomy-paper:var(--anatomy-card)}
.iso-plate-corners{position:absolute;inset:18px 20px;pointer-events:none}
.iso-plate-corner{position:absolute;color:var(--anatomy-muted);font-family:var(--anatomy-mono);font-size:10.5px;line-height:1;letter-spacing:.04em;white-space:nowrap}
.iso-plate-corner[data-corner="fig"]{top:0;left:0;color:var(--anatomy-text)}
.iso-plate-corner[data-corner="title"]{top:0;right:0;text-transform:uppercase;letter-spacing:.1em}
.iso-plate-corner[data-corner="hint"]{bottom:0;left:0;text-transform:uppercase;letter-spacing:.1em}
.iso-plate-corner[data-corner="readout"]{right:0;bottom:0;color:var(--anatomy-text);font-variant-numeric:tabular-nums}
.iso-plate .iso-svg{margin:0 auto}
.iso-legend{display:grid;gap:8px;margin-top:12px;color:var(--anatomy-muted);font-size:13px;line-height:1.55}
.iso-keys{display:flex;flex-wrap:wrap;gap:6px 18px}
.iso-key{display:inline-flex;align-items:center;gap:7px}
.iso-swatch{width:16px;height:10px;flex:none;overflow:visible}
.iso-swatch path{fill:none;stroke:var(--anatomy-hi);stroke-width:1;vector-effect:non-scaling-stroke;stroke-linejoin:round;stroke-linecap:round}
.iso-swatch[data-mark="raised"] path,.iso-swatch[data-mark="flat"] path{stroke:var(--anatomy-mid)}
.iso-swatch[data-mark="lit"] path{stroke:var(--anatomy-lit)}
.iso-swatch[data-mark="dim"] path{stroke:var(--anatomy-lo)}
.iso-swatch[data-mark="dotted"] path{stroke-dasharray:.01 3;stroke-width:1.4}
.iso-swatch[data-mark="dashed"] path{stroke-dasharray:3 2.5}
.iso-swatch[data-mark="red"] path{stroke:var(--anatomy-red)}
.iso-swatch[data-mark="green"] path{stroke:var(--anatomy-green)}
.iso-swatch[data-mark="blue"] path{stroke:var(--anatomy-blue)}
.iso-swatch-crease{stroke:var(--anatomy-lo)!important}
@media (max-width:560px){.iso-plate{padding:48px 12px 70px}.iso-plate-corner[data-corner="hint"]{bottom:18px}}
@media (prefers-reduced-motion:reduce){.iso-line[data-flow],.iso-dots circle[data-pulse]{animation:none}}

*{box-sizing:border-box}
html{color-scheme:dark}
body[data-theme="light"]{color-scheme:light}
body{margin:0;background:var(--anatomy-page);color:var(--anatomy-text);font:14px/1.6 ui-sans-serif,system-ui,-apple-system,"Segoe UI",sans-serif;-webkit-font-smoothing:antialiased}
.iso-page{width:min(650px,100% - 32px);margin:64px auto 96px}

html,body{height:100%;margin:0;overflow:hidden}
body.iso{background:var(--anatomy-page)}
.iso[data-theme="light"]{
  --anatomy-page:#edeae3;--anatomy-card:#edeae3;--anatomy-paper:#edeae3;--anatomy-text:#4f4b44;--anatomy-strong:#1d1b17;--anatomy-muted:#8a857b;
  --anatomy-face:#f8f6f1;--anatomy-top:#f6f4ee;
  --anatomy-shade-0:#c6c0b3;--anatomy-shade-1:#d2cdc2;--anatomy-shade-2:#dcd8ce;--anatomy-shade-3:#e5e1d8;
  --anatomy-lit-top:#ffffff;--anatomy-lit-shade:#efede7;
  --anatomy-hi:#24221d;--anatomy-mid:#746f66;--anatomy-lo:#a09a8f;--anatomy-faint:#c8c2b6;--anatomy-lit:#000000;
  --anatomy-halo:#6f6556;--anatomy-halo-opacity:.34;--anatomy-dot:#38352e;
}
.iso-page{width:100%;height:100%;margin:0}
.iso-figure{margin:0;height:100%}
.iso-plate{position:relative;height:100%;padding:0;box-shadow:inset 0 0 0 1px color-mix(in srgb,var(--anatomy-mid) 45%,transparent);overflow:hidden}
.iso-stage{position:absolute;inset:0;outline:none;cursor:pointer;touch-action:pan-y}
.iso-stage:focus-visible{outline:1px solid var(--anatomy-muted);outline-offset:-6px}
.iso-stage .iso-svg{position:absolute;inset:0;width:100%;height:100%;margin:0}
.iso-plate-corners{inset:clamp(10px,3.2vmin,22px) clamp(12px,3.2vw,26px);z-index:1}
.iso-plate-corner{font-size:clamp(8px,1.5vw,11.5px)}
.f2-window{fill:var(--anatomy-shade-0);stroke:var(--anatomy-lo);stroke-width:var(--anatomy-weight)}
.f2-void{fill:var(--anatomy-shade-0);stroke:none}
.f2-rivet{fill:var(--anatomy-dot);opacity:.45}
.f2-digit{font-weight:600}
.f2-live{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}
@media (max-width:560px){.iso-plate{padding:0}.iso-plate-corner[data-corner="hint"]{bottom:0}}

`;

const KIT = { iso, pathOf, towardViewer, lineSvg, solidSvg, cylinder, lineOnTop };
// The truth the figure plays: Retro's "save, then send" (transactional outbox).
// One worker step = claim (one DB write) -> run -> ONE atomic write (outputs + done + next hop) -> send.
// Job ids are run-step-revision, so the same step sent twice is one job in the next mailbox.
// Every value the page draws is a pure function of the tour clock t (seconds).

const STROKE = 18.3 // stamp head travel, rest to card face
const NUDGE = 1 // how far the head moves before the done bolt stops it
const SLIDE = 148 // card travel, inbox tray to the ledger page
const DROP = 40 // capsule fall into the send tube
const ACTS = [0, 8.4, 14.4]
const CYCLE = 28
const STILL_AT = 5.4 // reduced motion: saved, the next message waiting on the gate

const clamp01 = (v) => Math.min(1, Math.max(0, v))
const ease = (v) => { const x = clamp01(v); return x * x * (3 - 2 * x) }
const span = (t, a, b) => ease((t - a) / (b - a))
const fall = (t, a, b) => { const x = clamp01((t - a) / (b - a)); return x * x }

function stateAt(input) {
  const t = ((input % CYCLE) + CYCLE) % CYCLE
  const s = {
    t, act: t < ACTS[1] ? 0 : t < ACTS[2] ? 1 : 2,
    card: 0, cardAlpha: 0, cardInk: 0, head: 0, turn: 0, lamp: 1,
    ink: 0, working: 0, done: 0, tab: 0, bolt: 0,
    capsule: 0, capsuleDrop: 0, gate: 0, jobs: 0,
    saved: 0, sent: 0, phase: "",
  }
  const strike = (a) => { // head down a..a+.45, dwell .15, up .5
    return span(t, a, a + 0.45) * (1 - span(t, a + 0.6, a + 1.1))
  }
  const nudge = (a) => span(t, a, a + 0.25) * (1 - span(t, a + 0.35, a + 0.6))
  const send = (a) => { // gate opens a..a+.4, capsule falls a+.4..a+1, gate closes a+1.2..a+1.6
    s.gate = span(t, a, a + 0.4) * (1 - span(t, a + 1.2, a + 1.6))
    s.capsuleDrop = fall(t, a + 0.4, a + 1)
    if (t >= a + 1) s.capsule = 0
  }

  if (s.act === 0) {
    // a normal step
    s.cardAlpha = 1 - span(t, 6.8, 7.6)
    s.card = span(t, 0.4, 1.8)
    s.working = span(t, 1.8, 2.1) * (1 - span(t, 4.65, 4.8))
    s.turn = span(t, 2.2, 4.2)
    s.head = strike(4.2)
    const hit = t >= 4.65
    s.cardInk = s.ink = hit ? 1 : 0
    s.done = hit ? 1 : 0
    s.saved = hit ? 1 : 0
    s.tab = span(t, 4.65, 5.0)
    s.bolt = span(t, 4.9, 5.4)
    s.capsule = span(t, 4.7, 5.1)
    send(5.6)
    s.sent = t >= 6.0 ? 1 : 0
    s.jobs = t >= 6.0 ? 1 : 0
    s.phase = t < 0.4 ? "queued" : t < 1.8 ? "delivered" : t < 2.2 ? "claimed" : t < 4.65 ? "running" : t < 6.0 ? "saved" : t < 6.8 ? "sent" : "acked"
  } else if (s.act === 1) {
    // the same message delivered again
    s.cardAlpha = span(t, 8.4, 8.8) * (1 - span(t, 12.6, 13.2))
    s.card = span(t, 8.8, 10.2)
    s.head = nudge(10.2) * (NUDGE / STROKE)
    s.ink = 1 - span(t, 13.2, 13.8)
    s.done = 1 - span(t, 13.2, 13.8)
    s.tab = 1 - span(t, 13.2, 13.7)
    s.bolt = 1 - span(t, 13.4, 13.9)
    s.saved = 1
    s.capsule = span(t, 10.9, 11.3)
    send(11.4)
    s.sent = t >= 11.8 ? 2 : 1
    s.jobs = t < 13.4 ? 1 : 0
    s.phase = t < 10.2 ? "same job again" : t < 10.9 ? "claim refused" : t < 11.8 ? "re-send only" : t < 13.2 ? "1 job" : "next run"
  } else {
    // the worker dies after the save, before the send
    s.cardAlpha = span(t, 14.4, 14.8) * (1 - span(t, 22.2, 22.6)) + span(t, 22.6, 23.0) * (1 - span(t, 26.2, 26.8))
    s.card = t < 22.6 ? span(t, 14.8, 16.2) : span(t, 23.0, 24.4)
    s.working = span(t, 16.2, 16.5) * (1 - span(t, 19.05, 19.2))
    s.turn = span(t, 16.6, 18.6)
    s.head = strike(18.6) + nudge(24.4) * (NUDGE / STROKE)
    const hit = t >= 19.05
    s.cardInk = hit && t < 22.6 ? 1 : 0
    s.ink = hit ? 1 - span(t, 26.8, 27.4) : 0
    s.done = hit ? 1 - span(t, 26.8, 27.4) : 0
    s.saved = hit ? 1 : 0
    s.tab = span(t, 19.05, 19.4) * (1 - span(t, 26.8, 27.3))
    s.bolt = span(t, 19.3, 19.8) * (1 - span(t, 27, 27.5))
    s.capsule = span(t, 19.1, 19.5)
    send(25.0)
    s.lamp = 1 - span(t, 19.9, 20.2) * (1 - span(t, 22.2, 22.5))
    s.sent = t >= 25.4 ? 1 : 0
    s.jobs = t >= 25.4 && t < 27.4 ? 1 : 0
    s.phase = t < 16.2 ? "delivered" : t < 16.6 ? "claimed" : t < 19.05 ? "running" : t < 19.9 ? "saved" : t < 21.0 ? "worker died" : t < 22.6 ? "lock expires" : t < 24.4 ? "redelivered" : t < 25.0 ? "step done" : t < 25.4 ? "re-send only" : t < 26.8 ? "sent" : "next run"
  }
  return s
}

const readoutOf = (s) => `${s.phase} · saved ${s.saved} · sent ${s.sent}`

// Parts that change shape as the stamp moves. Imported by the build and inlined into the page,
// so the first frame and every later frame come from the same code. `k` is the iso kit.

const ROD = { x: 20, y: 0, r: 2.2 }
const HEAD_TOP = 40 // top of the head collar at rest
const ARM_BOTTOM = 70
const GLAND_TOP = 83
const ROD_TOP = 104 // rod tip at rest
const SPRING_R = 4.4
const DIAL = { x: 20, y: -32, r: 9.5, top: 86 }

function helix(k, P, cx, cy, r, z0, z1, turns) {
  const [vx, vy] = k.towardViewer(P)
  const count = Math.round(turns * 40)
  const front = []
  const back = []
  let run = null
  let side = null
  let prev = null
  for (let i = 0; i <= count; i++) {
    const a = (i / count) * turns * Math.PI * 2 + 0.6
    const p = [cx + r * Math.cos(a), cy + r * Math.sin(a), z0 + ((z1 - z0) * i) / count]
    const facing = Math.cos(a) * vx + Math.sin(a) * vy >= 0 ? "front" : "back"
    const q = k.iso(p, P)
    if (facing !== side) {
      run = prev ? [prev, q] : [q]
      ;(facing === "front" ? front : back).push(run)
      side = facing
    } else run.push(q)
    prev = q
  }
  const d = (runs) => runs.filter((r) => r.length > 1).map((r) => k.pathOf(r)).join("")
  return { front: d(front), back: d(back) }
}

// The rod between the head and the arm, wrapped by its return spring: back coil, rod, front coil.
function plungerSvg(k, P, dz) {
  const top = HEAD_TOP - dz
  const coil = helix(k, P, ROD.x, ROD.y, SPRING_R, top, ARM_BOTTOM, 6.5)
  return (
    k.lineSvg(coil.back, { tone: "lo" }) +
    k.solidSvg(k.cylinder(ROD.x, ROD.y, ROD.r, top, ARM_BOTTOM - top, P, 20), { tone: "mid", crease: "none" }) +
    k.lineSvg(coil.front, { tone: "mid" })
  )
}

// The rod above the gland, and its cap.
function rodTopSvg(k, P, dz) {
  const tip = ROD_TOP - dz
  return (
    k.solidSvg(k.cylinder(ROD.x, ROD.y, ROD.r, GLAND_TOP, tip - GLAND_TOP, P, 20), { tone: "mid", crease: "none" }) +
    k.solidSvg(k.cylinder(ROD.x, ROD.y, 3.4, tip, 3, P, 24, 0.4), { tone: "mid" })
  )
}

// The time-clock needle: one turn while the step runs.
function needleOf(k, P, turn) {
  const a = turn * Math.PI * 2
  const { x, y, r, top } = DIAL
  return k.lineOnTop([x - Math.sin(a) * 2.6, y + Math.cos(a) * 2.6], [x + Math.sin(a) * (r - 3.4), y - Math.cos(a) * (r - 3.4)], top + 0.2, P)
}

const DATA = {"P":{"origin":[360.61762763663893,225.72300062956583],"scale":1.5298691628208791,"azimuth":58,"elevation":30},"STROKE":18.3,"SLIDE":148,"DROP":40,"ACTS":[0,8.4,14.4],"CYCLE":28,"STILL_AT":5.4,"TAB_IN":-8,"BOLT_OUT":14,"GATE_OPEN":18};
// Page loop. Inlined after the kit, model.mjs and shapes.mjs; reads DATA from the build.
{
  const { P } = DATA
  const stage = document.querySelector(".iso-stage")
  const svg = stage.querySelector("svg")
  const part = (name) => svg.querySelector(`[data-part="${name}"]`)
  const el = {
    card: part("card"), cardInk: part("card-ink"), ink: part("ink"), check: part("check"), working: part("working"),
    tab: part("tab"), bolt: part("bolt"), head: part("head"), plunger: part("plunger"), rodtop: part("rodtop"),
    needle: part("needle"), lamp: part("lamp"), gate: part("gate"), capsule: part("capsule"), jobs: part("jobs"),
    halo: part("head-halo"),
  }
  const readout = document.querySelector("[data-readout]")
  const live = stage.querySelector(".f2-live")
  const still = matchMedia("(prefers-reduced-motion: reduce)")
  const speed = () => window.__driveSpeed || 1

  let clock = still.matches ? DATA.STILL_AT : 0
  let paused = false
  let frame = 0
  let last = 0
  let visible = false
  let lastHead = -1
  let lastPhase = ""
  const set = (node, name, value) => { if (node.getAttribute(name) !== value) node.setAttribute(name, value) }
  const alpha = (node, v) => set(node, "opacity", v.toFixed(3))
  const at = (dx, dy, dz) => translateAlong(P, [dx, dy, dz])

  function draw() {
    const s = stateAt(clock)
    set(el.card, "transform", at(s.card * DATA.SLIDE, 0, 0))
    alpha(el.card, s.cardAlpha)
    alpha(el.cardInk, s.cardInk)
    alpha(el.ink, s.ink)
    alpha(el.check, s.done)
    alpha(el.working, s.working)
    set(el.tab, "transform", at(DATA.TAB_IN * (1 - s.tab), 0, 0))
    set(el.bolt, "transform", at(DATA.BOLT_OUT * (1 - s.bolt), 0, 0))
    const dz = s.head * DATA.STROKE
    if (Math.abs(dz - lastHead) > 0.004) {
      lastHead = dz
      set(el.head, "transform", at(0, 0, -dz))
      el.plunger.innerHTML = plungerSvg(KIT, P, dz)
      el.rodtop.innerHTML = rodTopSvg(KIT, P, dz)
      alpha(el.halo, Math.max(0, (dz - 8) / (DATA.STROKE - 8)) * 0.25)
    }
    set(el.needle, "d", needleOf(KIT, P, s.turn))
    alpha(el.lamp, s.lamp)
    set(el.gate, "transform", at(0, DATA.GATE_OPEN * s.gate, 0))
    alpha(el.capsule, s.capsule * (1 - Math.max(0, (s.capsuleDrop - 0.55) / 0.45)))
    set(el.capsule, "transform", at(0, 0, -DATA.DROP * s.capsuleDrop))
    const jobs = String(s.jobs)
    if (el.jobs.textContent !== jobs) el.jobs.textContent = jobs
    const text = readoutOf(s)
    if (readout.textContent !== text) readout.textContent = text
    if (s.phase !== lastPhase) {
      lastPhase = s.phase
      stage.setAttribute("aria-valuetext", text)
      if (document.activeElement === stage) live.textContent = text
    }
  }

  function tick(now) {
    const dt = last ? Math.min((now - last) / 1000, 1 / 30) : 1 / 60
    last = now
    if (!paused && !still.matches) clock = (clock + dt * speed()) % DATA.CYCLE
    draw()
    frame = visible && !paused && !still.matches ? requestAnimationFrame(tick) : 0
  }
  const run = () => { if (!frame && visible) { last = 0; frame = requestAnimationFrame(tick) } }

  // stepping jumps the clock to the start of an act (under reduced motion, to that act's telling moment)
  const KEY = [5.4, 11.0, 21.0]
  const actOf = (t) => (t < DATA.ACTS[1] ? 0 : t < DATA.ACTS[2] ? 1 : 2)
  function stepTo(index) {
    const i = (index + 3) % 3
    clock = still.matches ? KEY[i] : DATA.ACTS[i]
    paused = false
    draw()
    run()
  }
  stage.addEventListener("click", () => stepTo(actOf(clock) + 1))
  stage.addEventListener("keydown", (event) => {
    if (event.key === "ArrowRight" || event.key === "ArrowDown" || event.key === "Enter") stepTo(actOf(clock) + 1)
    else if (event.key === "ArrowLeft" || event.key === "ArrowUp") stepTo(actOf(clock) - 1)
    else if (event.key === "Home") stepTo(0)
    else if (event.key === " ") { paused = !paused; if (!paused) run() }
    else return
    event.preventDefault()
  })
  stage.addEventListener("focus", () => { live.textContent = readout.textContent })
  still.addEventListener?.("change", () => { if (still.matches) clock = DATA.STILL_AT; draw(); run() })
  new IntersectionObserver((entries) => {
    visible = entries[entries.length - 1].isIntersecting
    if (visible) run()
  }, { rootMargin: "120px 0px" }).observe(stage)
  draw()
}
